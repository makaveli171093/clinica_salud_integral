name: Backend NestJS
on:
  push:
    branches: [migration/nestjs, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: clinic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://clinic:isolated-test-password@localhost:5432/clinic_test
      TEST_DATABASE_URL: postgresql://clinic:isolated-test-password@localhost:5432/clinic_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm test:db
